# Local development only. Credentials here are not secrets; prod uses Cloud SQL via Secret Manager.
# pgvector image because Conduit's retrieval (Day 2+) needs the vector extension.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
